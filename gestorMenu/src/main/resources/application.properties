spring.application.name=gestorMenu

server.port=8080
spring.datasource.url=jdbc:mysql://localhost:3306/menu
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# 2. Habilitar explícitamente el registro y la descarga de catálogo de Eureka
spring.cloud.compatibility-verifier.enabled=false
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# 3. Dirección IP y puerto donde está escuchando tu Eureka Server
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# 4. Configuración dinámica para mapear la instancia localmente
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1
eureka.instance.hostname=127.0.0.1
eureka.instance.instance-id=127.0.0.1:${spring.application.name}:${server.port}
